server:
  port: 8080
  servlet:
    context-path:

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/community-forum?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: 1234567890
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
  data:
    redis:
      host: localhost
      port: 6379
      password: 1234567890

jwt:
  secret: zaigeiwoshifenzhonghaomabaobei321
  expiration: 604800000
  header: Authorization
  token-prefix: Bearer

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.community.entity
  configuration:
    # 开启驼峰命名自动映射（如：user_name → userName）
    map-underscore-to-camel-case: true
    # 控制台打印 SQL 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  file:
    name: logs/community-forum.log  # 日志文件路径和名字
  level:
    com.community: DEBUG           # 你项目的包，打印 DEBUG 级别日志
    com.baomidou: DEBUG            # MyBatis-Plus 日志
    com.zaxxer.hikari: DEBUG       # Hikari 连接池日志
    org.springframework: WARN      # Spring 框架只打印警告和错误